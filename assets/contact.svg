<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Let's build something. Briefs welcome.">
  <title>Let's build something. Briefs welcome.</title>
  <style>@keyframes ring{0%{transform:scale(1);opacity:.55}80%,100%{transform:scale(3.6);opacity:0}}.ring{transform-box:fill-box;transform-origin:50% 50%;animation:ring 2.2s ease-out infinite}@keyframes rise{0%{transform:translateY(14px);opacity:0}100%{transform:translateY(0);opacity:1}}.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) .15s both}@keyframes nudge{0%{transform:translateX(0)}100%{transform:translateX(18px)}}.nudge{animation:nudge 1.1s ease-in-out infinite alternate}@media (prefers-reduced-motion:reduce){*{animation:none!important}.ring{opacity:0}}</style>
  <rect x="0.5" y="0.5" width="999" height="219" rx="16" fill="#ff5a36" stroke="#e8481f"/>
  <g class="rise">
    <circle class="ring" cx="70" cy="62" r="6" fill="#0e0f12"/>
    <circle cx="70" cy="62" r="6" fill="#0e0f12"/>
    <text x="90" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="2.4" fill="#0e0f12">BRIEFS WELCOME</text>
    <text x="58" y="158" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="72" letter-spacing="-2.8" fill="#0e0f12">Let’s build something.</text>
    <g class="nudge"><text x="842" y="158" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="72" fill="#0e0f12">→</text></g>
  </g>
</svg>
