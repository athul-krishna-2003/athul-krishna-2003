<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d">
  <title id="t">Athul Krishna, web developer</title>
  <desc id="d">Client briefs are struck through with a red pen and replaced by the code that ships them.</desc>
  <style>
@keyframes g0{0%,6.0%{opacity:0}8.5%,92%{opacity:1}96%,100%{opacity:0}}.g0{animation:g0 20.0s linear infinite}
@keyframes b0{0%,11.0%{opacity:1}13.5%,100%{opacity:.42}}.b0{animation:b0 20.0s linear infinite}
@keyframes s0{0%,11.0%{stroke-dashoffset:314}13.25%,100%{stroke-dashoffset:0}}.s0{stroke-dasharray:314;stroke-dashoffset:314;animation:s0 20.0s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes c0{0%,14.5%{transform:scaleX(1);animation-timing-function:steps(24,end)}21.0%,100%{transform:scaleX(0)}}.c0{transform-box:fill-box;transform-origin:100% 50%;animation:c0 20.0s linear infinite}
@keyframes k0{0%,14.5%{transform:translateX(0);opacity:0}14.55%{transform:translateX(0);opacity:1;animation-timing-function:steps(24,end)}21.0%{transform:translateX(288px);opacity:1}21.05%,100%{transform:translateX(288px);opacity:0}}.k0{animation:k0 20.0s linear infinite}
@keyframes g1{0%,21.0%{opacity:0}23.5%,92%{opacity:1}96%,100%{opacity:0}}.g1{animation:g1 20.0s linear infinite}
@keyframes b1{0%,26.0%{opacity:1}28.5%,100%{opacity:.42}}.b1{animation:b1 20.0s linear infinite}
@keyframes s1{0%,26.0%{stroke-dashoffset:269}28.25%,100%{stroke-dashoffset:0}}.s1{stroke-dasharray:269;stroke-dashoffset:269;animation:s1 20.0s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes c1{0%,29.5%{transform:scaleX(1);animation-timing-function:steps(29,end)}36.0%,100%{transform:scaleX(0)}}.c1{transform-box:fill-box;transform-origin:100% 50%;animation:c1 20.0s linear infinite}
@keyframes k1{0%,29.5%{transform:translateX(0);opacity:0}29.55%{transform:translateX(0);opacity:1;animation-timing-function:steps(29,end)}36.0%{transform:translateX(348px);opacity:1}36.05%,100%{transform:translateX(348px);opacity:0}}.k1{animation:k1 20.0s linear infinite}
@keyframes g2{0%,36.0%{opacity:0}38.5%,92%{opacity:1}96%,100%{opacity:0}}.g2{animation:g2 20.0s linear infinite}
@keyframes b2{0%,41.0%{opacity:1}43.5%,100%{opacity:.42}}.b2{animation:b2 20.0s linear infinite}
@keyframes s2{0%,41.0%{stroke-dashoffset:358}43.25%,100%{stroke-dashoffset:0}}.s2{stroke-dasharray:358;stroke-dashoffset:358;animation:s2 20.0s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes c2{0%,44.5%{transform:scaleX(1);animation-timing-function:steps(26,end)}51.0%,100%{transform:scaleX(0)}}.c2{transform-box:fill-box;transform-origin:100% 50%;animation:c2 20.0s linear infinite}
@keyframes k2{0%,44.5%{transform:translateX(0);opacity:0}44.55%{transform:translateX(0);opacity:1;animation-timing-function:steps(26,end)}51.0%{transform:translateX(312px);opacity:1}51.05%,100%{transform:translateX(312px);opacity:0}}.k2{animation:k2 20.0s linear infinite}
@keyframes g3{0%,51.0%{opacity:0}53.5%,92%{opacity:1}96%,100%{opacity:0}}.g3{animation:g3 20.0s linear infinite}
@keyframes b3{0%,56.0%{opacity:1}58.5%,100%{opacity:.42}}.b3{animation:b3 20.0s linear infinite}
@keyframes s3{0%,56.0%{stroke-dashoffset:246}58.25%,100%{stroke-dashoffset:0}}.s3{stroke-dasharray:246;stroke-dashoffset:246;animation:s3 20.0s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes c3{0%,59.5%{transform:scaleX(1);animation-timing-function:steps(20,end)}66.0%,100%{transform:scaleX(0)}}.c3{transform-box:fill-box;transform-origin:100% 50%;animation:c3 20.0s linear infinite}
@keyframes k3{0%,59.5%{transform:translateX(0);opacity:0}59.55%{transform:translateX(0);opacity:1;animation-timing-function:steps(20,end)}66.0%,100%{transform:translateX(240px);opacity:1}}.k3{animation:k3 20.0s linear infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1.1s steps(1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.b0{opacity:.42}.s0{stroke-dashoffset:0}.c0{transform:scaleX(0)}.k0{opacity:0}.b1{opacity:.42}.s1{stroke-dashoffset:0}.c1{transform:scaleX(0)}.k1{opacity:0}.b2{opacity:.42}.s2{stroke-dashoffset:0}.c2{transform:scaleX(0)}.k2{opacity:0}.b3{opacity:.42}.s3{stroke-dashoffset:0}.c3{transform:scaleX(0)}.k3{opacity:0}}
  </style>
  <rect x="0.5" y="0.5" width="999" height="499" rx="16" fill="#0e0f12" stroke="#24262b"/>

  <text x="60" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="2.2" fill="#9a9a93">INSIGHTS MARKETERS  ·  ERNAKULAM, KERALA</text>
  <text x="58" y="146" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="72" letter-spacing="-2.4" fill="#e9e4d6">Athul Krishna</text>
  <text x="60" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#9a9a93">I turn client briefs into websites that ship.</text>

  <line x1="60" y1="222" x2="940" y2="222" stroke="#24262b"/>
  <text x="60" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="2.2" fill="#9a9a93">THE BRIEF</text>
  <text x="520" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="2.2" fill="#9a9a93">THE BUILD</text>

  <g class="g0">
    <text class="b0" x="60" y="300" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="24" fill="#e9e4d6">“Make it feel more premium.”</text>
    <line class="s0" x1="52" y1="294" x2="366" y2="290" stroke="#ff5a36" stroke-width="2.5" stroke-linecap="round"/>
    <text x="520" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#d8d4c8" xml:space="preserve">letter-spacing: -0.03em;</text>
    <rect class="c0" x="518" y="276" width="318" height="34" fill="#0e0f12"/>
    <g class="k0"><rect class="blink" x="520" y="280" width="10" height="26" fill="#ff5a36"/></g>
  </g>
  <g class="g1">
    <text class="b1" x="60" y="352" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="24" fill="#e9e4d6">“Can it convert better?”</text>
    <line class="s1" x1="52" y1="346" x2="321" y2="342" stroke="#ff5a36" stroke-width="2.5" stroke-linecap="round"/>
    <text x="520" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#d8d4c8" xml:space="preserve">&lt;Cta position="above-fold" /&gt;</text>
    <rect class="c1" x="518" y="328" width="378" height="34" fill="#0e0f12"/>
    <g class="k1"><rect class="blink" x="520" y="332" width="10" height="26" fill="#ff5a36"/></g>
  </g>
  <g class="g2">
    <text class="b2" x="60" y="404" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="24" fill="#e9e4d6">“Like the other site, but ours.”</text>
    <line class="s2" x1="52" y1="398" x2="410" y2="394" stroke="#ff5a36" stroke-width="2.5" stroke-linecap="round"/>
    <text x="520" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#d8d4c8" xml:space="preserve">git checkout -b not-a-copy</text>
    <rect class="c2" x="518" y="380" width="342" height="34" fill="#0e0f12"/>
    <g class="k2"><rect class="blink" x="520" y="384" width="10" height="26" fill="#ff5a36"/></g>
  </g>
  <g class="g3">
    <text class="b3" x="60" y="456" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="24" fill="#e9e4d6">“Needed it by Friday.”</text>
    <line class="s3" x1="52" y1="450" x2="298" y2="446" stroke="#ff5a36" stroke-width="2.5" stroke-linecap="round"/>
    <text x="520" y="456" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#d8d4c8" xml:space="preserve">git push origin main</text>
    <rect class="c3" x="518" y="432" width="270" height="34" fill="#0e0f12"/>
    <g class="k3"><rect class="blink" x="520" y="436" width="10" height="26" fill="#ff5a36"/></g>
  </g>
</svg>
